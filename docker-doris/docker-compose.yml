version: "3.8"

networks:
  doris-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.80.0/24

services:
  doris-fe:
    image: apache/doris:fe-3.1.4
    container_name: doris-fe
    hostname: fe
    ports:
      - "8030:8030"
      - "9030:9030"
    environment:
      - FE_SERVERS=fe1:172.20.80.2:9010
      - FE_ID=1
    volumes:
      - ./data/fe:/opt/apache-doris/fe/doris-meta
    networks:
      doris-net:
        ipv4_address: 172.20.80.2
    healthcheck:
      test: ["CMD", "bash", "-c", "cat /opt/apache-doris/fe/log/fe.log 2>/dev/null | grep -q 'thrift server started'"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  doris-be:
    image: apache/doris:be-3.1.4
    container_name: doris-be
    hostname: be
    depends_on:
      doris-fe:
        condition: service_healthy
    environment:
      - FE_SERVERS=fe1:172.20.80.2:9010
      - BE_ADDR=172.20.80.3:9050
    ports:
      - "8040:8040"
    volumes:
      - ./data/be:/opt/apache-doris/be/storage
    networks:
      doris-net:
        ipv4_address: 172.20.80.3
    restart: unless-stopped
